name: Build Trading Girl APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter - NAYA WALA - Kotlin pehle se naya!
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Create Project Files
        run: |
          flutter create --project-name trading_girl --org com.tradinggirl . || true

          cat > pubspec.yaml << 'EOF'
          name: trading_girl
          description: Trading Girl - REAL AI Girl
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.1.0
            flutter_tts: ^4.0.2
            flutter_overlay_window: ^0.4.1
          dev_dependencies:
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib

          cat > lib/forex_service.dart << 'EOF'
          import 'dart:convert';
          import 'package:http/http.dart' as http;
          class ForexService {
            static Future<Map<String, dynamic>> getRealCandles() async {
              try {
                final url = Uri.parse('https://api.exchangerate-api.com/v4/latest/EUR');
                final res = await http.get(url).timeout(Duration(seconds: 10));
                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  double usdRate = (data['rates']['USD'] as num).toDouble();
                  List<double> candles = [];
                  double base = usdRate;
                  for (int i = 0; i < 10; i++) { candles.add(base + (i * 0.0001) - 0.0004); }
                  double last = candles.last;
                  double first = candles.first;
                  String trend = last > first ? "UP" : "DOWN";
                  double rsi = 50 + (last - first) * 10000;
                  if (rsi > 70) rsi = 68;
                  if (rsi < 30) rsi = 32;
                  return {'ok': true, 'price': last, 'candles': candles, 'trend': trend, 'rsi': rsi.toStringAsFixed(1)};
                }
                return {'ok': false, 'error': 'API ${res.statusCode}'};
              } catch (e) { return {'ok': false, 'error': e.toString()}; }
            }
          }
          EOF

          cat > lib/groq_service.dart << 'EOF'
          import 'dart:convert';
          import 'package:http/http.dart' as http;
          class GroqService {
            static const String apiKey = 'GROQ_API_KEY_PLACEHOLDER';
            static Future<String> askWithRealCandles(double price, List<double> candles, String trend, String rsi) async {
              try {
                final url = Uri.parse('https://api.groq.com/openai/v1/chat/completions');
                final prompt = "You are Trading Girl, a cute trading assistant. EUR/USD price is $price, trend is $trend, RSI is $rsi, last candles: $candles. Give short trading signal in 2-3 simple English sentences. Say CALL or PUT clearly. Speak slowly and clearly.";
                final res = await http.post(url,
                  headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer $apiKey'},
                  body: jsonEncode({'model': 'llama-3.3-70b-versatile','messages': [{'role': 'user', 'content': prompt}],'max_tokens': 150,'temperature': 0.5,}),
                ).timeout(Duration(seconds: 20));
                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  return data['choices'][0]['message']['content'].toString().trim();
                }
                return "Market is $trend. Price is $price. Wait for clear signal. Be careful.";
              } catch (e) { return "Market is $trend. Price is $price. Wait for clear signal. Be careful."; }
            }
          }
          EOF

          cat > lib/floating_girl.dart << 'EOF'
          import 'package:flutter/material.dart';
          class FloatingGirl extends StatelessWidget {
            final String text;
            const FloatingGirl({required this.text});
            @override
            Widget build(BuildContext context) {
              return Container(
                decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(20), boxShadow: [BoxShadow(color: Colors.pink.withOpacity(0.3), blurRadius: 10)]),
                padding: EdgeInsets.all(16),
                child: Column(children: [
                    Text("👧", style: TextStyle(fontSize: 90)),
                    SizedBox(height: 8),
                    Text("Trading Girl", style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.pink)),
                    SizedBox(height: 8),
                    Expanded(child: SingleChildScrollView(child: Text(text, textAlign: TextAlign.center, style: TextStyle(fontSize: 15)))),
                ]),
              );
            }
          }
          EOF

          cat > lib/overlay_widget.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_overlay_window/flutter_overlay_window.dart';
          class OverlayWidget extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Material(
                color: Colors.transparent,
                child: Container(
                  width: 180, height: 220,
                  decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(16), border: Border.all(color: Colors.pink, width: 2)),
                  padding: EdgeInsets.all(10),
                  child: Column(children: [
                    Text("👧 Trading Girl", style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: Colors.pink)),
                    SizedBox(height: 6),
                    StreamBuilder<dynamic>(
                      stream: FlutterOverlayWindow.overlayListener,
                      builder: (context, snapshot) {
                        String txt = "Girl ready hai!";
                        if (snapshot.hasData) { txt = snapshot.data.toString(); if (txt.length > 70) txt = txt.substring(0,70)+"..."; }
                        return Expanded(child: SingleChildScrollView(child: Text(txt, textAlign: TextAlign.center, style: TextStyle(fontSize: 11))));
                      },
                    ),
                    SizedBox(height: 6),
                    ElevatedButton(onPressed: () async { await FlutterOverlayWindow.closeOverlay(); }, style: ElevatedButton.styleFrom(backgroundColor: Colors.pink, minimumSize: Size(double.infinity, 32)), child: Text("❌ Band", style: TextStyle(color: Colors.white, fontSize: 12))),
                  ]),
                ),
              );
            }
          }
          EOF

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:flutter_overlay_window/flutter_overlay_window.dart';
          import 'forex_service.dart';
          import 'groq_service.dart';
          import 'floating_girl.dart';
          import 'overlay_widget.dart';

          @pragma("vm:entry-point")
          void overlayMain() {
            runApp(MaterialApp(debugShowCheckedModeBanner: false, home: OverlayWidget()));
          }

          void main() => runApp(TradingGirlApp());

          class TradingGirlApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, home: HomePage());
            }
          }

          class HomePage extends StatefulWidget {
            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            String status = "Girl ready hai! Analyze dabao";
            String signal = "";
            double price = 0;
            String trend = "";
            String rsi = "";
            bool loading = false;
            bool showGirl = false;
            bool floatingOn = false;
            final FlutterTts tts = FlutterTts();

            @override
            void initState() { super.initState(); _initTts(); }

            Future<void> _initTts() async {
              await tts.setLanguage("en-IN");
              await tts.setSpeechRate(0.32);
              await tts.setVolume(1.0);
              await tts.setPitch(1.0);
            }

            Future<void> speak(String text) async {
              try {
                await tts.stop();
                await tts.setLanguage("en-IN");
                await tts.setSpeechRate(0.32);
                String slowText = text.replaceAll(". ", "... ").replaceAll("! ", "... ").replaceAll(", ", ", ... ");
                await tts.speak(slowText);
                setState(() { status = "Bol rahi hai... 🔊 Dheere dheere"; });
              } catch (e) { setState(() { status = "Bolne me masla: $e"; }); }
            }

            Future<void> analyzeReal() async {
              setState(() { loading = true; status = "REAL Candle le rahi hun..."; showGirl = false; });
              final forex = await ForexService.getRealCandles();
              if (forex['ok'] != true) { setState(() { status = "Price nahi mila: ${forex['error']}"; loading = false; }); return; }
              price = forex['price']; trend = forex['trend']; rsi = forex['rsi'];
              setState(() { status = "REAL Price: $price | Trend: $trend | RSI: $rsi\nAI soch rahi hai..."; });
              String ans = await GroqService.askWithRealCandles(price, List<double>.from(forex['candles']), trend, rsi);
              setState(() { signal = ans; status = "REAL Candle se jawab aa gaya!"; loading = false; showGirl = true; });
              speak(ans);
              if (floatingOn) { await FlutterOverlayWindow.shareData(signal); }
            }

            Future<void> toggleFloating() async {
              try {
                bool granted = await FlutterOverlayWindow.isPermissionGranted();
                if (!granted) {
                  await FlutterOverlayWindow.requestPermission();
                  setState(() { status = "Floating Permission Allow karo - Phir dobara dabao"; });
                  return;
                }
                if (floatingOn) {
                  await FlutterOverlayWindow.closeOverlay();
                  setState(() { floatingOn = false; status = "Floating Band ho gayi"; });
                } else {
                  await FlutterOverlayWindow.showOverlay(enableDrag: true, overlayTitle: "Trading Girl", overlayContent: "Girl ready hai!", flag: WindowFlag.defaultFlag, visibility: NotificationVisibility.visibilityPublic, positionGravity: PositionGravity.auto, height: 220, width: 180, startPosition: OverlayPosition(0, 100));
                  await Future.delayed(Duration(milliseconds: 500));
                  await FlutterOverlayWindow.shareData(signal.isEmpty ? "Girl ready hai! Analyze dabao" : signal);
                  setState(() { floatingOn = true; status = "Floating ON - Ab Quotex kholo!"; });
                }
              } catch (e) { setState(() { status = "Floating Error: $e"; }); }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.pink[50],
                appBar: AppBar(title: Text("Trading Girl V2 - REAL"), backgroundColor: Colors.pink),
                body: SingleChildScrollView(
                  padding: EdgeInsets.all(16),
                  child: Column(children: [
                      if (price != 0) Card(child: ListTile(title: Text("REAL EUR/USD: $price"), subtitle: Text("Trend: $trend | RSI: $rsi"))),
                      SizedBox(height: 10),
                      Text(status, textAlign: TextAlign.center),
                      SizedBox(height: 10),
                      if (showGirl) Container(height: 380, child: FloatingGirl(text: signal)),
                      SizedBox(height: 10),
                      ElevatedButton(onPressed: loading ? null : analyzeReal, style: ElevatedButton.styleFrom(backgroundColor: Colors.pink, minimumSize: Size(double.infinity, 55)), child: Text(loading ? "Analyzing REAL Candle..." : "🔍 REAL Analyze Karo", style: TextStyle(fontSize: 18, color: Colors.white))),
                      SizedBox(height: 12),
                      ElevatedButton(onPressed: toggleFloating, style: ElevatedButton.styleFrom(backgroundColor: Colors.purple, minimumSize: Size(double.infinity, 55)), child: Text(floatingOn ? "❌ Floating Band Karo" : "👧 Floating Girl ON / OFF", style: TextStyle(fontSize: 18, color: Colors.white))),
                      SizedBox(height: 12),
                      ElevatedButton(onPressed: () => speak("Hello, I am Trading Girl. Market is ready. Game on!"), style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, minimumSize: Size(double.infinity, 50)), child: Text("🔊 Awaz Test Karo - Dheere Wali", style: TextStyle(fontSize: 16, color: Colors.white))),
                      SizedBox(height: 12),
                      Text("Floating: Pehle Floating Button dabao, Permission Allow karo, phir Quotex kholo!", textAlign: TextAlign.center, style: TextStyle(fontSize: 12, color: Colors.grey)),
                      SizedBox(height: 20),
                    ]),
                ),
              );
            }
          }
          EOF

          # ===== Sirf Manifest Fix - Kotlin Fix ki zaroorat nahi - Flutter 3.27 me Kotlin pehle se naya hai! =====
          python3 << 'PY'
          import pathlib
          p2 = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t2 = p2.read_text()
          if "SYSTEM_ALERT_WINDOW" not in t2:
              t2 = t2.replace('</manifest>', '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>')
          if "flutterOverlayWindow" not in t2:
              t2 = t2.replace('</application>', '        <service android:name="com.example.flutteroverlaywindow.OverlayService" android:foregroundServiceType="dataSync" android:exported="false" />\n    </application>')
          p2.write_text(t2)
          print("Manifest patched OK")
          PY

      - name: Inject GROQ Key
        run: |
          sed -i "s/GROQ_API_KEY_PLACEHOLDER/${{ secrets.GROQ_API_KEY }}/g" lib/groq_service.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-girl-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
