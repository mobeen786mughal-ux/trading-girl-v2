name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Unzip and Build APK
        run: |
          unzip -o trading_girl_v2.zip
          cp -r trading_girl_v2/lib ./my_lib
          cp trading_girl_v2/pubspec.yaml ./my_pubspec.yaml
          cp -r trading_girl_v2/assets ./my_assets
          flutter create ./fresh_tmp --org com.yourname.tradinggirl --project-name trading_girl_v2
          rm -rf android
          cp -r ./fresh_tmp/android ./android
          rm -rf lib
          cp -r ./my_lib lib
          cp ./my_pubspec.yaml pubspec.yaml
          cp -r ./my_assets assets
          python3 << 'PY'
          import pathlib
          # 1. INTERNET PERMISSION - Yehi asli masla tha!
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          print('BEFORE MANIFEST:')
          print(t)
          if 'android.permission.INTERNET' not in t:
              t = t.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application')
              p.write_text(t)
              print('INTERNET PERMISSION ADDED!')
          # 2. minSdk 24
          for fname in ['android/app/build.gradle.kts','android/app/build.gradle']:
              pp = pathlib.Path(fname)
              if pp.exists():
                  tt = pp.read_text()
                  tt = tt.replace('flutter.minSdkVersion','24').replace('minSdk = 21','minSdk = 24').replace('minSdkVersion 21','minSdkVersion 24')
                  pp.write_text(tt)
          PY
          pip install Pillow
          python3 << 'PY'
          from PIL import Image
          import os
          try:
              img = Image.open('assets/app_icon.png').convert('RGB')
              for folder, size in [('mipmap-xxxhdpi',192),('mipmap-xxhdpi',144),('mipmap-xhdpi',96),('mipmap-hdpi',72),('mipmap-mdpi',48)]:
                  path = f'android/app/src/main/res/{folder}'
                  os.makedirs(path, exist_ok=True)
                  img.resize((size, size)).save(f'{path}/ic_launcher.png')
              print('ICON FIXED - TERI WALI GIRL HI HAI')
          except Exception as e:
              print('Icon fix fail:', e)
          PY
          rm -rf ./fresh_tmp ./my_lib ./my_pubspec.yaml ./my_assets
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-girl-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
