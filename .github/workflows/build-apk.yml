name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Unzip and Build APK
        run: |
          unzip -o trading_girl_v2.zip
          cp -r trading_girl_v2/lib ./my_lib
          cp trading_girl_v2/pubspec.yaml ./my_pubspec.yaml
          cp -r trading_girl_v2/assets ./my_assets
          flutter create ./fresh_tmp --org com.yourname.tradinggirl --project-name trading_girl_v2
          ls ./fresh_tmp/android/
          rm -rf android
          cp -r ./fresh_tmp/android ./android
          ls ./android/
          rm -rf lib
          cp -r ./my_lib lib
          cp ./my_pubspec.yaml pubspec.yaml
          cp -r ./my_assets assets
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi
          for d in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do cp assets/app_icon.png android/app/src/main/res/$d/ic_launcher.png; done
          rm -rf ./fresh_tmp ./my_lib ./my_pubspec.yaml ./my_assets
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-girl-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
