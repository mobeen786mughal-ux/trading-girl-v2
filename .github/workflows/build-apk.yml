name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Unzip and Build APK
        run: |
          unzip -o trading_girl_v2.zip
          cp -r trading_girl_v2/lib /tmp/my_lib
          cp trading_girl_v2/pubspec.yaml /tmp/my_pubspec.yaml
          cp -r trading_girl_v2/assets /tmp/my_assets
          flutter create /tmp/fresh --org com.yourname.tradinggirl --project-name trading_girl_v2
          cp -r /tmp/fresh/android ./android
          rm -rf lib
          cp -r /tmp/my_lib lib
          cp /tmp/my_pubspec.yaml pubspec.yaml
          cp -r /tmp/my_assets assets
          python3 -c "
          import pathlib, re
          for f in ['android/build.gradle','android/settings.gradle','android/app/build.gradle']:
              p = pathlib.Path(f)
              if p.exists():
                  t = p.read_text()
                  t = re.sub(r\"kotlin_version\s*=\s*['\\\"]?[0-9.]+['\\\"]?\", \"kotlin_version = '2.1.0'\", t)
                  t = t.replace('1.9.0','2.1.0').replace('1.9.22','2.1.0').replace('1.9.24','2.1.0')
                  p.write_text(t)
                  print(f, 'FIXED')
                  print(p.read_text()[:800])
          "
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi
          for d in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do cp assets/app_icon.png android/app/src/main/res/$d/ic_launcher.png; done
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-girl-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
