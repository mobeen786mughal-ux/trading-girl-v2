name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Unzip and Build APK
        run: |
          unzip -o trading_girl_v2.zip
          cp -r trading_girl_v2/lib /tmp/my_lib
          cp trading_girl_v2/pubspec.yaml /tmp/my_pubspec.yaml
          cp -r trading_girl_v2/assets /tmp/my_assets
          flutter create /tmp/fresh --org com.yourname.tradinggirl --project-name trading_girl_v2
          cp -r /tmp/fresh/android ./android
          rm -rf lib
          cp -r /tmp/my_lib lib
          cp /tmp/my_pubspec.yaml pubspec.yaml
          cp -r /tmp/my_assets assets
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '2.1.0'/" android/build.gradle
          sed -i "s/org.jetbrains.kotlin.android version '.*'/org.jetbrains.kotlin.android version '2.1.0'/" android/settings.gradle || true
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-girl-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
